name: naperu-mail
services:
  mailserver:
    image: ${MAILSERVER_IMAGE:?Use pinned runtime.env}
    hostname: mail.naperu.cloud
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 512
    environment:
      SSL_TYPE: manual
      SSL_CERT_PATH: /run/naperu-mail/certs/fullchain.pem
      SSL_KEY_PATH: /run/naperu-mail/certs/privkey.pem
      TLS_LEVEL: modern
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: 1
      ENABLE_RSPAMD: 1
      ENABLE_RSPAMD_REDIS: 1
      ENABLE_CLAMAV: 1
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_AMAVIS: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_POSTGREY: 0
      ENABLE_FAIL2BAN: 0
      RSPAMD_GREYLISTING: 0
      RSPAMD_CHECK_AUTHENTICATED: 1
      ENABLE_POP3: 0
      ENABLE_MANAGESIEVE: 0
      LOG_LEVEL: info
      POSTMASTER_ADDRESS: soporte@naperu.cloud
      ACCOUNT_PROVISIONER: FILE
      ONE_DIR: 1
      TZ: America/Lima
    volumes:
      - ./config:/tmp/docker-mailserver
      - ./certs:/run/naperu-mail/certs:ro
      - ./mail-data:/var/mail
      - ./mail-state:/var/mail-state
      - ./mail-logs:/var/log/mail
    networks:
      mail:
        aliases: [mail.naperu.cloud]
    healthcheck:
      test: [CMD-SHELL, "ss --listening --tcp --numeric | grep -q ':465 ' && ss --listening --tcp --numeric | grep -q ':993 '"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 180s
  roundcube:
    image: ${ROUNDCUBE_IMAGE:?Use pinned runtime.env}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.naperu.cloud
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://mail.naperu.cloud
      ROUNDCUBEMAIL_SMTP_PORT: 465
      ROUNDCUBEMAIL_USERNAME_DOMAIN: naperu.cloud
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 10M
    volumes:
      - ./roundcube-db:/var/roundcube/db
      - ./roundcube-config:/var/roundcube/config:ro
      - ./roundcube-trust:/run/naperu-mail:ro
    networks:
      - mail
      - proxy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
networks:
  mail:
    name: naperu-mail-private
  proxy:
    external: true
    name: dokploy-network
