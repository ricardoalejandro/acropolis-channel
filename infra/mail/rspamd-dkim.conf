# Key belongs only to this domain; no private key is versioned.
selector = "mail202610";
path = "/tmp/docker-mailserver/rspamd/dkim/$domain.$selector.key";
allow_username_mismatch = false;
sign_authenticated = true;
sign_local = true;
try_fallback = false;
use_domain = "header";
domain {
  naperu.cloud {
    selector = "mail202610";
    path = "/tmp/docker-mailserver/rspamd/dkim/naperu.cloud.mail202610.key";
  }
}
