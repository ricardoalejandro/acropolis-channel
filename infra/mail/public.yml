# Browser access uses HTTPS 443 through Roundcube. Only inbound SMTP is public.
services:
  mailserver:
    cap_add: [NET_ADMIN]
    environment:
      ENABLE_FAIL2BAN: 1
    ports:
      - "72.61.37.46:25:25"
      - "127.0.0.1:465:465"
      - "127.0.0.1:993:993"
    networks:
      mail:
        aliases: [mail.naperu.cloud]
      application_smtp:
        aliases: [mail.naperu.cloud]
  roundcube:
    environment:
      NAPERU_MAIL_PUBLIC: 1
networks:
  application_smtp:
    external: true
    name: naperu-mail-smtp
