name: acropolis-channel
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: acropolis
      POSTGRES_USER: acropolis_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Configure DB_ADMIN_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Configure DB_APP_PASSWORD}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Configure DB_MIGRATION_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U acropolis_admin -d acropolis"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 2g
    cpus: 1.0
    logging: *logging
  migrations:
    image: ${MIGRATION_IMAGE:-acropolis-channel-migrations:local}
    profiles: [migration]
    environment:
      ConnectionStrings__Database: Host=db;Database=acropolis;Username=acropolis_migrator;Password=${DB_MIGRATION_PASSWORD};Timeout=5;Command Timeout=30
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
  web:
    image: ${APP_IMAGE:-acropolis-channel:local}
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Database=acropolis;Username=acropolis_app;Password=${DB_APP_PASSWORD};Timeout=3;Command Timeout=3
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    networks:
      private: {}
      publication:
        aliases: [acropolis-channel-web]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    logging: *logging
networks:
  private:
    internal: true
  publication:
    external: true
    name: ${TRAEFIK_NETWORK:?Configure TRAEFIK_NETWORK}
volumes:
  database:
