name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: acropolis-channel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy through SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f -- "$key_file" "$known_hosts_file"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          unset SSH_AUTH_SOCK SSH_PRIVATE_KEY SSH_KNOWN_HOSTS

          ssh -F /dev/null -T \
            -i "$key_file" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts_file" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" deploy
