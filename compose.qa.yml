# Isolated run variables only. Always invoke with --env-file /dev/null.
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${QA_DATABASE:?QA database required}
      POSTGRES_USER: acropolis_admin
      POSTGRES_PASSWORD: ${QA_PASSWORD:?QA admin password required}
      DB_APP_PASSWORD: ${QA_APP_PASSWORD:?QA app password required}
      DB_MIGRATION_PASSWORD: ${QA_MIGRATION_PASSWORD:?QA migrator password required}
    volumes:
      - database:/var/lib/postgresql
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
  proxy:
    image: caddy:2.11.6-alpine
    environment:
      QA_HOST: ${QA_HOST:?Private QA hostname required}
    volumes:
      - ./infra/qa/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    read_only: true
    tmpfs: ["/config:size=16m,mode=1777", "/tmp:size=16m,mode=1777"]
    networks:
      default:
        aliases: ["${QA_HOST}"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
  pki:
    image: ${QA_PKI_IMAGE:?QA PKI image required}
    profiles: [tools]
    entrypoint: [/bin/bash, /qa-infra/prepare-pki.sh]
    environment:
      QA_PROJECT: ${QA_PROJECT}
      QA_APP_UID: ${QA_APP_UID:-1654}
      QA_DP_PASSWORD: ${QA_DP_PASSWORD:?QA protector password required}
    volumes:
      - ./infra/qa:/qa-infra:ro
      - caddy:/caddy-data
      - keyring:/keyring
      - ${QA_TLS:?QA TLS path required}:/tls
      - ${QA_ARTIFACTS:?QA artifacts required}:/artifacts
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_SMTP_TLS_CERT: /smtp/cert.pem
      MP_SMTP_TLS_KEY: /smtp/key.pem
      MP_SMTP_REQUIRE_STARTTLS: 'true'
      MP_SMTP_AUTH: qa:${QA_SMTP_PASSWORD:?QA SMTP password required}
      MP_MAX_MESSAGES: '200'
    volumes:
      - ${QA_TLS}/smtp:/smtp:ro
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
  web:
    image: ${QA_IMAGE:?Candidate image required}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: web;localhost;127.0.0.1;${QA_HOST}
      ConnectionStrings__Database: Host=db;Port=5432;Database=${QA_DATABASE};Username=acropolis_app;Password=${QA_APP_PASSWORD};Timeout=3;Command Timeout=3;Pooling=true
      Identity__PublicOrigin: https://${QA_HOST}:8443
      Identity__KnownProxies: ${QA_PROXY_IP:-127.0.0.1}
      Identity__DataProtection__KeyRingPath: /var/acropolis/keys
      Identity__DataProtection__ApplicationName: AcropolisChannel
      Identity__DataProtection__CertificatePath: /run/secrets/acropolis-dp.pfx
      Identity__DataProtection__CertificatePassword: ${QA_DP_PASSWORD}
      Identity__Smtp__Host: mailpit
      Identity__Smtp__Port: '1025'
      Identity__Smtp__Username: qa
      Identity__Smtp__Password: ${QA_SMTP_PASSWORD}
      Identity__Smtp__FromEmail: qa@acropolis.test
      Identity__Smtp__FromName: Acropolis QA
      Identity__Smtp__Security: starttls
      SSL_CERT_FILE: /qa-trust/ca-bundle.crt
      SSL_CERT_DIR: /etc/ssl/certs
    volumes:
      - keyring:/var/acropolis/keys
      - ${QA_TLS}/trust:/qa-trust:ro
      - ${QA_TLS}/protection/protector.pfx:/run/secrets/acropolis-dp.pfx:ro
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 128
  migrations:
    image: ${QA_MIGRATION_IMAGE:?Migration image required}
    profiles: [tools]
    environment:
      DOTNET_ENVIRONMENT: Testing
      QA_SEED_PASSWORD: ${QA_IDENTITY_PASSWORD}
      Identity__PublicOrigin: https://${QA_HOST}:8443
      Identity__DataProtection__KeyRingPath: /var/acropolis/keys
      Identity__DataProtection__ApplicationName: AcropolisChannel
      Identity__DataProtection__CertificatePath: /run/secrets/acropolis-dp.pfx
      Identity__DataProtection__CertificatePassword: ${QA_DP_PASSWORD}
      Identity__Smtp__Host: mailpit
      Identity__Smtp__Port: '1025'
      Identity__Smtp__Username: qa
      Identity__Smtp__Password: ${QA_SMTP_PASSWORD}
      Identity__Smtp__FromEmail: qa@acropolis.test
      Identity__Smtp__FromName: Acropolis QA
      Identity__Smtp__Security: starttls
      SSL_CERT_FILE: /qa-trust/ca-bundle.crt
      SSL_CERT_DIR: /etc/ssl/certs
      ConnectionStrings__Database: Host=db;Port=5432;Database=${QA_DATABASE};Username=acropolis_migrator;Password=${QA_MIGRATION_PASSWORD};Timeout=3;Command Timeout=30
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - keyring:/var/acropolis/keys
      - ${QA_TLS}/trust:/qa-trust:ro
      - ${QA_TLS}/protection/protector.pfx:/run/secrets/acropolis-dp.pfx:ro
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
  sdk:
    image: ${QA_SDK_IMAGE:?SDK QA image required}
    profiles: [tools]
    entrypoint: [/bin/bash, -euc]
    environment:
      DOTNET_ENVIRONMENT: Testing
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_PROCESSOR_COUNT: '1'
      TEST_DATABASE_CONNECTION: Host=db;Port=5432;Database=${QA_DATABASE};Username=acropolis_admin;Password=${QA_PASSWORD};Timeout=3;Command Timeout=30
    volumes:
      - ${QA_ARTIFACTS}:/artifacts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 1
    pids_limit: 256
  node:
    image: ${QA_NODE_IMAGE:?Node QA image required}
    profiles: [tools]
    entrypoint: [/bin/sh, -euc]
    environment:
      NODE_OPTIONS: --max-old-space-size=768
      QA_IDENTITY_PASSWORD: ${QA_IDENTITY_PASSWORD}
      NODE_EXTRA_CA_CERTS: /qa-trust/root.crt
      BASE_URL: https://${QA_HOST}:8443
      QA_PROJECT: ${QA_PROJECT}
      MAILPIT_URL: http://mailpit:8025
    volumes:
      - ${QA_ARTIFACTS}:/artifacts
      - ${QA_TLS}/trust:/qa-trust:ro
      - ./tests/load:/qa-tools:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024m
    cpus: 1
    pids_limit: 256
  playwright:
    image: ${QA_PLAYWRIGHT_IMAGE:?Playwright image required}
    profiles: [tools]
    entrypoint: [/bin/bash, /qa-infra/playwright-entry.sh, /bin/bash, -euc]
    environment:
      BASE_URL: https://${QA_HOST}:8443
      PREVIEW_URL: http://preview:8081
      MAILPIT_URL: http://mailpit:8025
      QA_PROJECT: ${QA_PROJECT}
      PLAYWRIGHT_OUTPUT_DIR: /artifacts/playwright
      PLAYWRIGHT_HTML_REPORT: /artifacts/playwright-report
      NODE_OPTIONS: --max-old-space-size=768
      QA_IDENTITY_PASSWORD: ${QA_IDENTITY_PASSWORD}
      NODE_EXTRA_CA_CERTS: /qa-trust/root.crt
      CI: '1'
      QA_SESSION_STATE_DIR: /artifacts/session-state
    volumes:
      - ${QA_ARTIFACTS}:/artifacts
      - ${QA_TLS}/trust:/qa-trust:ro
      - ./infra/qa:/qa-infra:ro
    init: true
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 1
    pids_limit: 256
  preview:
    image: ${QA_PREVIEW_IMAGE:?Separate preview image required}
    profiles: [preview]
    read_only: true
    tmpfs: ["/config:size=16m,mode=1777", "/data:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
  k6:
    image: grafana/k6:2.3.0
    profiles: [tools]
    user: '0:0'
    environment:
      BASE_URL: https://${QA_HOST}:8443
      SSL_CERT_FILE: /qa-trust/ca-bundle.crt
      QA_SEED_PASSWORD: ${QA_IDENTITY_PASSWORD}
    volumes:
      - ./tests/load:/qa-tools:ro
      - ${QA_TLS}/trust:/qa-trust:ro
      - ${QA_ARTIFACTS}:/artifacts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
networks:
  default:
    name: ${QA_PROJECT:?Unique QA project required}_network
    labels:
      acropolis.qa.run: ${QA_PROJECT}
volumes:
  database:
    name: ${QA_PROJECT}_postgres
    labels:
      acropolis.qa.run: ${QA_PROJECT}
  keyring:
    name: ${QA_PROJECT}_keyring
    labels:
      acropolis.qa.run: ${QA_PROJECT}
  caddy:
    name: ${QA_PROJECT}_caddy
    labels:
      acropolis.qa.run: ${QA_PROJECT}
